databases:
  - name: colweyz-db
    databaseName: colweyz_db
    user: colweyz_user
    plan: free # Change to starter/standard depending on your needs

services:
  - type: web
    name: colweyz-app
    env: node
    plan: free # Change to starter/standard depending on your needs
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: colweyz-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # The following keys are secrets. You will be prompted to enter them in the Render Dashboard securely.
      - key: GEMINI_API_KEY
        sync: false
      - key: CLE_API_CLAUDE
        sync: false
